name: Android Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/patch GitHub Releases and attach APKs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      # Signing is optional: when the secrets are unset the release APK is
      # simply built unsigned (the workflow never fails over missing secrets).
      - name: Configure release signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured; building an unsigned release APK."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          SIGNING_KEYSTORE=release.jks
          SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS
          SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # Stage APKs into a flat dist/ dir with readable names. The in-app updater
      # only offers signed release APKs, so release attachments carry the signed
      # build when signing is configured and the unsigned/debug ones otherwise.
      - name: Stage APK outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/clearcut-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/clearcut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/clearcut-release-unsigned.apk
          fi
          ls -la dist

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearcut-debug-apk
          path: dist/clearcut-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearcut-release-apk
          path: dist/clearcut-release*.apk
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/

      # Build a release when a v* tag is pushed (covers the tag-driven flow),
      # and attach APKs to an already-published release when the event is a release.
      # The dist glob matches whichever release APK was staged (signed when
      # signing secrets are configured; unsigned otherwise). Debug builds are
      # never attached to releases.
      - name: Create/update GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClearCut ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/clearcut-release*.apk

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clearcut-release*.apk